name: Generate pastel contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate pastel snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: esm4ydn
          outputs: |
            dist/github-snake.svg?color_snake=%23D9B8F0&color_dots=%231F1B2E,%23F6D9E9,%23E9C8F2,%23C7D5F4,%23A8DED3

      - name: Publish generated SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
